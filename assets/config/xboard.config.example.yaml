# XBoard Configuration for Mitveepn Client
# 配置文件 - Mitveepn VPN客户端

xboard:
  # Backend provider name (must match the key in config.json)
  # 后端提供商名称（必须与 config.json 中的 key 匹配）
  provider: mitveepn

  # Remote configuration sources
  # 远程配置源 - 指向托管的 config.json 文件
  remote_config:
    sources:

      # Backup source from Gitee (optional)
      # 备用配置源 - Gitee (可选)
      - name: backup_cloudflare_r2
        url: https://api.mitveepn.work/config.json
        priority: 100

      # Main configuration source
      # 主配置源 - 请将 config.json 上传到 GitHub/Gitee/CDN 后修改此 URL
      - name: mitbg000
        url: https://mitbg000.com/api/mitveepn/config.json
        priority: 90

      #   encryption_key: YOUR_ENCRYPTION_KEY_HERE

    # Request timeout in seconds
    timeout_seconds: 30

    # Maximum retry attempts
    max_retries: 3

    # Delay between retries (seconds)
    retry_delay_seconds: 2

  # Latency testing configuration
  # 延迟测试配置
  latency_test:
    # Test URL - Faster alternatives for Vietnam/China
    # 测试 URL - 针对越南/中国优化
    test_url: http://www.gstatic.com/generate_204
    # Alternative: http://cp.cloudflare.com/generate_204
    timeout_seconds: 5

  # Domain racing service configuration
  # 域名竞速服务配置
  domain_service:
    # Enable domain racing (automatically select fastest server)
    # 启用域名竞速（自动选择最快的服务器）
    enable: true

    # Cache duration in minutes
    cache_minutes: 5

    # Maximum retry attempts for domain racing
    max_retries: 3

    # Timeout for each domain test (seconds)
    test_timeout_seconds: 5

    # Maximum concurrent domain tests
    max_concurrent_tests: 5

  # SDK configuration
  sdk:
    # Request timeout in milliseconds
    timeout_milliseconds: 30000

    # Enable debug logging (set to false in production)
    # 启用调试日志（生产环境设置为 false）
    enable_debug_log: true

    # Initialization strategy
    # race_fastest: Race multiple domains and use the fastest (recommended)
    # default: Use domains in order
    strategy: race_fastest

  # Logging configuration
  # 日志配置
  log:
    # Enable logging
    enabled: true

    # Log level: debug, info, warning, error
    # 日志级别：debug（开发）, info（生产）, warning, error
    level: info

    # Log prefix for filtering
    prefix: "[Mitveepn]"

  # Application branding
  # 应用品牌信息
  app:
    # Title shown on login screen
    # 登录页面显示的标题
    title: Mitveepn

    # Website URL shown on login screen
    # 登录页面显示的网站地址
    website: mitveepn.work

  # Subscription configuration
  # 订阅配置
  subscription:
    # Prefer encrypted subscription
    # true: Try encrypted subscription first (with domain racing), fallback to normal
    # false: Use normal subscription directly (no domain racing)
    # 是否优先使用加密订阅
    prefer_encrypt: false

  # Security and encryption settings
  # 安全与加密配置
  security:
    # Decryption key for encrypted subscriptions
    # This must match the encryption key configured in your XBoard backend
    # 订阅解密密钥（需要与后端配置一致）
    decrypt_key: ""

    # Response obfuscation prefix
    # Used to de-obfuscate API responses if backend uses Caddy rewrite
    # Example: If Caddy config has: replace "{\"status\"" "OBFS_PREFIX_{\"status\""
    # Then set this to: "OBFS_PREFIX_"
    # Leave empty or null if backend doesn't use obfuscation
    # 响应混淆前缀（如果后端没有使用混淆，留空）
    obfuscation_prefix: ""

    # User-Agent configuration (for domain racing and API requests)
    # ⚠️ Important: These User-Agent strings are agreed upon with backend
    # Modifying them may cause authentication failures
    # User-Agent 配置（用于域名竞速和 API 请求）
    user_agents:
      # API request User-Agent (with encrypted authentication token)
      # The encrypted token part should be provided by your backend admin
      # API 请求 User-Agent（包含加密认证令牌）
      api_encrypted: "Mozilla/5.0 (compatible; MitveepnClient/1.0)"

      # Domain racing test User-Agent
      # 域名竞速测试 User-Agent
      domain_racing_test: "Mitveepn/1.0 (Domain Racing Test)"

    # TLS certificate configuration
    # TLS 证书配置
    certificate:
      # Certificate file path (relative to packages directory)
      # Used for HTTPS verification in domain racing
      # 证书文件路径（相对于 packages 目录）
      path: flutter_xboard_sdk/assets/cer/client-cert.crt

      # Enable certificate verification
      # ⚠️ WARNING: Disabling this creates serious security risks
      # Only disable in trusted test environments
      # 是否启用证书验证（生产环境必须启用）
      enabled: true

  # Crisp customer support integration
  # Crisp 客服系统集成
  customer_support:
    # Crisp website ID
    crisp_website_id: "5d26cfe4-d28f-45de-8b83-65a9bd8754a5"

    # Enable customer support chat
    enabled: true

  # Update configuration
  # 更新配置
  update:
    # Enable auto-check for updates
    enable_auto_check: true

    # Check interval in seconds (86400 = 24 hours)
    check_interval_seconds: 86400

    # Minimum required version
    minimum_version: "0.8.0"
